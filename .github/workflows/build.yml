# Copyright (C) 2026 Davidian
# Builds and tests the plugin on Windows, macOS and Linux: LV2 and VST3 everywhere, and the
# Audio Unit on macOS. Steinberg's VST3 validator and Apple's auval check those formats.
# Pushing a tag such as v1.1.0 also publishes a GitHub release with a ready-made zip for
# each platform.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Build and test (LV2 and VST3)
        shell: cmd
        run: build.bat test
      - name: Build Steinberg's VST3 validator (MIT, not shipped)
        shell: bash
        run: |
          git clone -q --depth 1 https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cd "$RUNNER_TEMP/vst3sdk"
          git submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S . -B build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF > configure.log
          cmake --build build --target validator --config Release > build.log || { tail -50 build.log; exit 1; }
      - name: Validate the VST3
        shell: bash
        run: |
          "$RUNNER_TEMP/vst3sdk/build/bin/Release/validator.exe" build/vst3/twinline.vst3 | tee build-test/validator.txt
      - name: Package
        shell: cmd
        run: build.bat dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-windows-x64
          path: build/dist/*.zip
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshot-windows
          path: |
            build-test/ui_window.bmp
            build-test/vst3_window.bmp
            build-test/validator.txt

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Build (universal arm64 + x86_64)
        run: make VERSION="$VERSION"
      - name: Check architectures
        run: |
          for f in build/lv2/twinline.lv2/*.dylib build/vst3/twinline.vst3/Contents/MacOS/twinline \
                   build/au/twinline.component/Contents/MacOS/twinline; do
            lipo -info "$f"
            lipo "$f" -verify_arch arm64 x86_64
          done
      - name: Ad-hoc sign
        run: |
          codesign --force --sign - build/lv2/twinline.lv2/*.dylib
          codesign --force --sign - build/vst3/twinline.vst3
          codesign --force --sign - build/au/twinline.component
          plutil -lint build/vst3/twinline.vst3/Contents/Info.plist build/au/twinline.component/Contents/Info.plist
      - name: Offline tests (DSP, panel, VST3 host check)
        run: make test
      - name: LV2 GUI test (Cocoa)
        run: |
          clang -O2 -x objective-c -fno-objc-arc tests/ui_check_mac.m -framework Cocoa -o build-test/ui_check_mac
          ./build-test/ui_check_mac build/lv2/twinline.lv2 build-test/ui_window_macos.png
      - name: Build Steinberg's VST3 validator (MIT, not shipped)
        run: |
          git clone -q --depth 1 https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cd "$RUNNER_TEMP/vst3sdk"
          git submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF > configure.log
          cmake --build build --target validator --config Release > build.log || { tail -50 build.log; exit 1; }
      - name: Validate the VST3
        run: |
          "$(find "$RUNNER_TEMP/vst3sdk/build/bin" -name validator -type f | head -1)" build/vst3/twinline.vst3 | tee build-test/validator.txt
      - name: Install the Audio Unit
        run: |
          make install
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i dvdn
      - name: Validate the Audio Unit (auval)
        run: auval -strict -v aufx Twln Dvdn | tee build-test/auval.txt
      - name: AU test (audio, state and Cocoa view)
        run: |
          clang -O2 -x objective-c -fno-objc-arc tests/au_check_mac.m -framework Cocoa -framework AudioToolbox \
            -framework AudioUnit -framework CoreAudio -o build-test/au_check_mac
          ./build-test/au_check_mac build-test/au_window_macos.png
      - name: Package
        run: make dist VERSION="$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-macos-universal
          path: build/dist/*.zip
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshot-macos
          path: |
            build-test/ui_window_macos.png
            build-test/au_window_macos.png
            build-test/validator.txt
            build-test/auval.txt

  linux:
    strategy:
      fail-fast: false
      matrix:
        # 22.04 keeps the glibc requirement low (2.35) so the binaries run on older distros.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libx11-dev xvfb xauth \
            lilv-utils lv2-dev zip python3
      - name: Build
        run: make VERSION="$VERSION"
      - name: Offline tests (DSP, panel, VST3 host check)
        run: make test
      - name: LV2 GUI load test (X11 on a virtual display)
        run: |
          cc -O2 -std=c99 -Wall tests/ui_load_check.c -o build-test/ui_load_check -ldl
          xvfb-run -a ./build-test/ui_load_check build/lv2/twinline.lv2
      - name: Check the LV2 bundle with lilv
        run: |
          export LV2_PATH="$PWD/build/lv2"
          lv2info urn:davidian:twinline | tee build-test/lv2info.txt
          grep -q "Blend" build-test/lv2info.txt
          grep -q "X11UI" build-test/lv2info.txt
          python3 -c "import wave,struct,math; w=wave.open('build-test/in.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(48000); w.writeframes(b''.join(struct.pack('<h',int(8000*math.sin(2*math.pi*220*i/48000))) for i in range(48000))); w.close()"
          lv2apply -i build-test/in.wav -o build-test/out.wav urn:davidian:twinline
          test -s build-test/out.wav
      - name: Build Steinberg's VST3 validator (MIT, not shipped)
        run: |
          git clone -q --depth 1 https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cd "$RUNNER_TEMP/vst3sdk"
          git submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake
          # The hosting examples (a GTK editor host) aren't needed for the validator.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF > configure.log || { tail -30 configure.log; exit 1; }
          cmake --build build --target validator --config Release -j 4 > build.log || { tail -50 build.log; exit 1; }
      - name: Validate the VST3
        run: |
          "$(find "$RUNNER_TEMP/vst3sdk/build/bin" -name validator -type f | head -1)" build/vst3/twinline.vst3 | tee build-test/validator.txt
      - name: Package
        run: make dist VERSION="$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.runner == 'ubuntu-22.04-arm' && 'linux-arm64' || 'linux-x64' }}
          path: build/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Davidian Twinline $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
